<div class="modal fade" id="activityModal" tabindex="-1" aria-labelledby="activityModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post" action="{% url 'tracker:set_daily_activity' %}">
                {% csrf_token %}
                {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
                <div class="modal-header">
                    <h5 class="modal-title" id="activityModalLabel">
                        <i class="bi bi-smartwatch me-2"></i>Bewegung bearbeiten
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="activityModalDate">Datum</label>
                        <input type="date" id="activityModalDate" name="date" class="form-control" value="{{ today|date:'Y-m-d' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="activityModalLevel">Bewegungslevel</label>
                        <select id="activityModalLevel" name="level" class="form-select" onchange="toggleActivityCustomInput()">
                            <option value="none">Keine (0 kcal)</option>
                            <option value="low">Wenig (+{{ profile.activity_kcal_low }} kcal)</option>
                            <option value="medium">Mittel (+{{ profile.activity_kcal_medium }} kcal)</option>
                            <option value="high">Hoch (+{{ profile.activity_kcal_high }} kcal)</option>
                            <option value="custom">Apple Watch / Manuell (kcal)</option>
                        </select>
                    </div>
                    <div class="mb-2" id="activityCustomWrap">
                        <label class="form-label" for="activityModalCustomKcal">Apple Watch / Manuelle Kalorien (kcal)</label>
                        <input type="number" id="activityModalCustomKcal" name="custom_kcal" min="0" step="1" class="form-control" placeholder="z. B. 650">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Speichern
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
function toggleActivityCustomInput() {
    const levelSel = document.getElementById("activityModalLevel");
    const wrap = document.getElementById("activityCustomWrap");
    if (!levelSel || !wrap) return;
    wrap.style.display = levelSel.value === "custom" ? "block" : "none";
}

function openActivityModal(dateIso, level, kcal) {
    const dateEl = document.getElementById("activityModalDate");
    const levelEl = document.getElementById("activityModalLevel");
    const kcalEl = document.getElementById("activityModalCustomKcal");
    if (dateEl && dateIso) dateEl.value = dateIso;
    if (levelEl) levelEl.value = level || "none";
    if (kcalEl) kcalEl.value = (level === "custom" && kcal) ? kcal : "";
    toggleActivityCustomInput();
    bootstrap.Modal.getOrCreateInstance(document.getElementById("activityModal")).show();
}

document.addEventListener("DOMContentLoaded", toggleActivityCustomInput);
</script>
