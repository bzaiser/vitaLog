{{ activity_chart_data|json_script:data_id }}
<script>
(function() {
    const dataEl = document.getElementById("{{ data_id }}");
    const canvas = document.getElementById("{{ canvas_id }}");
    if (!dataEl || !canvas) return;

    const ad = JSON.parse(dataEl.textContent);
    const bodyColor = getComputedStyle(document.documentElement).getPropertyValue("--bs-body-color").trim() || "#1e293b";

    new Chart(canvas, {
        type: "bar",
        data: {
            labels: ad.labels,
            datasets: [{
                label: "Bewegung (kcal)",
                data: ad.values,
                backgroundColor: "#6f42c1bb",
                borderRadius: 5
            }]
        },
        options: {
            responsive: true,
            onClick: function(evt, elements) {
                if (!elements.length || typeof openActivityModal !== "function") return;
                const idx = elements[0].index;
                const dateIso = ad.dates ? ad.dates[idx] : "";
                const level = ad.levels ? ad.levels[idx] : "custom";
                const kcal = ad.values ? ad.values[idx] : 0;
                openActivityModal(dateIso, level, kcal);
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        afterLabel: function() { return "Klicken zum Ändern"; }
                    }
                }
            },
            scales: {
                x: { ticks: { color: bodyColor } },
                y: {
                    beginAtZero: true,
                    suggestedMax: ad.suggested_max,
                    ticks: {
                        color: bodyColor,
                        callback: function(v) { return v + " kcal"; }
                    }
                }
            }
        }
    });
})();
</script>
